<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Food Discovery</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <main class="shell">
    <p class="eyebrow">Vector Food Discovery</p>
    <h1>Food Discovery</h1>
    <p class="lede">Search by craving, in any language. Describe the food, flavor or cuisine you want and get the closest matches, optionally filtered by minimum rating.</p>

    <form id="search-form" class="search-bar" autocomplete="off">
      <span class="search-icon">&#9906;</span>
      <input id="query" type="text" placeholder="Search for food, flavor, cuisine..." maxlength="500" aria-label="Search for food">
      <button id="submit" class="btn-search" type="submit">Search</button>
    </form>

    <p class="label">Example searches</p>
    <div id="examples" class="chips"></div>

    <p class="label">Rating</p>
    <div class="rating-row">
      <label id="rating-toggle" class="toggle">
        <input id="rating-enabled" type="checkbox"> Minimum rating
      </label>
      <div class="slider-wrap">
        <input id="rating" type="range" min="0" max="10" step="0.5" value="7" disabled aria-label="Minimum rating">
        <span id="rating-value" class="rating-value">Any</span>
      </div>
    </div>

    <p class="label">Near</p>
    <div class="near-row">
      <div class="location-chips">
        <button id="loc-anywhere" class="chip active" type="button">Anywhere</button>
        <button id="loc-near" class="chip" type="button">&#128205; Near me</button>
      </div>
      <select id="radius" class="radius-select" aria-label="Search radius" hidden>
        <option value="10">within 10 km</option>
        <option value="25">within 25 km</option>
        <option value="50">within 50 km</option>
      </select>
      <span id="near-status" class="near-status"></span>
    </div>

    <div id="map" role="application" aria-label="Map of where dishes are available. Click to search near a spot"></div>
    <p id="map-hint" class="map-hint"></p>

    <div id="results"></div>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" defer></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
